<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Stacks</title>
    <!-- Relative URLs only: the app serves under /<slug>/app/, so a
         root-absolute /styles.css would resolve against the DOMAIN root. -->
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem("stacks.theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#board">Skip to board</a>

    <header class="topbar">
      <div class="topbar__group">
        <span class="wordmark">
          <span class="wordmark__mark" aria-hidden="true"></span>
          Stacks
        </span>

        <div class="picker">
          <button class="picker__button" id="board-menu-button" aria-haspopup="true" aria-expanded="false">
            <span id="board-name">…</span>
            <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="menu" id="board-menu" hidden></div>
        </div>
      </div>

      <div class="topbar__group">
        <button class="iconbutton" id="theme-toggle" title="Switch theme" aria-label="Switch theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 .9v1.8M8 13.3v1.8M.9 8h1.8M13.3 8h1.8M2.9 2.9l1.3 1.3M11.8 11.8l1.3 1.3M13.1 2.9l-1.3 1.3M4.2 11.8l-1.3 1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 9.7A5.8 5.8 0 016.3 2.5a5.8 5.8 0 107.2 7.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="account" id="account"></div>
      </div>
    </header>

    <main id="board" class="board" tabindex="-1">
      <p class="board__status mono" id="status">Loading your board</p>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet__scrim" data-close></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Card details">
        <div class="sheet__head">
          <span class="mono eyebrow" id="sheet-column"></span>
          <button class="iconbutton" data-close aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <textarea class="sheet__title" id="sheet-title" rows="1" placeholder="Card title" maxlength="200"></textarea>
        <label class="mono eyebrow sheet__label" for="sheet-body">Notes</label>
        <textarea class="sheet__body" id="sheet-body" placeholder="Anything worth remembering" maxlength="5000"></textarea>
        <div class="sheet__foot">
          <span class="mono sheet__meta" id="sheet-meta"></span>
          <button class="button button--danger" id="sheet-delete">Delete card</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
